name: Full regression and project audit

on:
  push:
    branches:
      - codex/**
  pull_request:
    branches:
      - codex/fotmob-depth-routing
      - codex/inteligencia-compartilhada
      - codex/implementation-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q app.py src scripts tests

      - name: Run non-destructive project inventory
        run: |
          python scripts/project_audit.py \
            --database database/tactical_lab.db \
            --output "${{ runner.temp }}/tactical-project-audit.json"

      - name: Run complete automated test suite
        run: python -m pytest -q --tb=short

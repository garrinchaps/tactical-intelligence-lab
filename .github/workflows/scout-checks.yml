name: Scout module checks

on:
  push:
    branches:
      - codex/fotmob-depth-routing
      - claude/gifted-knuth-q93cbz
  pull_request:
    branches:
      - codex/inteligencia-compartilhada
      - claude/gifted-knuth-q93cbz
  workflow_dispatch:

jobs:
  scout-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy pandas scipy pytest
      - name: Compile Scout code and app
        run: python -m compileall -q src/scout src/ui/pages/scout.py app.py scripts/inventory_deploy_data.py
      - name: Test scouting engine
        run: python -m pytest -q tests/test_scout_engine.py tests/test_database_path_config.py
